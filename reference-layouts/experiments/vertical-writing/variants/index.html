<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio / Vertical Writing Study</title>
  <style>
    @font-face { font-family: "Noto Sans Mongolian"; src: url("../fonts/NotoSansMongolian-Regular.ttf") format("truetype"); font-display: block; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9eded; color: #242622; font-family: Arial, sans-serif; letter-spacing: 0; }
    header { padding: 24px 32px; border-bottom: 1px solid #bcc5c2; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
    h1 { margin: 0 auto 0 0; font-size: 22px; }
    .tabs { display: flex; border: 1px solid #8c9692; }
    button { font: inherit; cursor: pointer; padding: 9px 12px; border: 0; background: transparent; color: inherit; }
    button[aria-pressed="true"] { background: #254e42; color: white; }
    label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
    main { max-width: 1700px; margin: auto; padding: 24px 32px 48px; }
    section > h2 { font-size: 18px; margin: 8px 0 16px; }
    .pages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; margin-bottom: 32px; }
    figure { margin: 0; min-width: 0; }
    figcaption { font-size: 13px; color: #53605b; margin-top: 10px; }
    .frame { position: relative; width: 100%; aspect-ratio: 794 / 1123; }
    .page { width: 794px; height: 1123px; position: absolute; top: 0; left: 0; transform-origin: top left; background: #fff; border: 1px solid #333; padding: 60px; display: flex; flex-direction: column; gap: 22px; }
    .page::after { content: ""; position: absolute; inset: 60px; outline: 1px dotted #5877a6; pointer-events: none; display: none; }
    body.guides .page::after { display: block; }
    .runhead, .folio { display: flex; justify-content: space-between; align-items: center; font: 12px/1.4 Arial,sans-serif; color: #58655e; }
    .runhead { border-bottom: 1px solid #bac2bd; padding-bottom: 10px; }
    .folio { border-top: 1px solid #bac2bd; padding-top: 12px; margin-top: auto; }
    .hero { height: 280px; display: grid; grid-template-columns: 1fr 108px; gap: 24px; flex: none; }
    .mn .hero { grid-template-columns: 108px 1fr; }
    .title { writing-mode: vertical-rl; font: 36px/1.5 "Songti SC", "Noto Serif CJK SC", serif; margin: 0; color: #913c43; }
    .mn .title { writing-mode: vertical-lr; font: 36px/1.55 "Noto Sans Mongolian",sans-serif; }
    .mn .hero .title { grid-column: 1; grid-row: 1; }
    .visual { margin: 0; display: flex; flex-direction: column; gap: 9px; min-height: 0; }
    .visual img { width: 100%; height: 248px; object-fit: cover; display: block; }
    .caption { font: 11px/1.4 Arial,sans-serif; color: #657068; }
    .copy { flex: 1; min-width: 0; min-height: 0; width: 100%; writing-mode: vertical-rl; font: 19px/1.8 "Songti SC", "Noto Serif CJK SC",serif; line-break: strict; }
    .copy p { margin: 0; margin-block-end: 15px; text-indent: 2em; }
    .zh .copy p { text-indent: 2em; }
    .mn .copy { writing-mode: vertical-lr; font-family: "Noto Sans Mongolian",sans-serif; font-size: 20px; line-height: 1.9; }
    .mn .copy p { text-indent: 0; margin-block-end: 18px; }
    .combine { text-combine-upright: all; }
    .reading { display: flex; gap: 24px; flex: 1; min-height: 0; }
    .reading .copy { flex: 1; }
    .rail { width: 142px; flex: none; border-left: 1px solid #bcc5c2; padding-left: 18px; display: flex; flex-direction: column; gap: 18px; }
    .rail img { width: 123px; height: 182px; object-fit: cover; }
    .rail .note { writing-mode: vertical-rl; height: 360px; font: 17px/1.8 "Songti SC",serif; color: #913c43; }
    .mn .reading { flex-direction: row-reverse; }
    .mn .rail { border-left: 0; border-right: 1px solid #bcc5c2; padding-left: 0; padding-right: 18px; }
    .mn .rail .note { writing-mode: vertical-lr; font-family: "Noto Sans Mongolian",sans-serif; font-size: 23px; }
    .section-title { font: 27px/1.3 "Songti SC",serif; margin: 0; color: #913c43; }
    .mn .section-title { writing-mode: vertical-lr; height: 105px; font-family: "Noto Sans Mongolian",sans-serif; font-size: 29px; }
    .composition { display: grid; grid-template-columns: minmax(0, 1fr) 66px; gap: 26px; flex: 1; min-height: 0; }
    .variant-title { grid-column: 2; grid-row: 1; margin: 0; writing-mode: vertical-rl; text-orientation: upright; font: 34px/1.4 "Songti SC",serif; color: #913c43; padding-left: 14px; }
    .variant-body { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: 22px; min-width: 0; min-height: 0; }
    .mn .composition { grid-template-columns: 66px minmax(0, 1fr); }
    .mn .variant-title { grid-column: 1; font-family: "Noto Sans Mongolian",sans-serif; writing-mode: vertical-lr; text-orientation: mixed; font-size: 34px; padding-left: 0; padding-right: 14px; }
    .mn .variant-body { grid-column: 2; }
    .wide-media { height: 300px; flex: none; }
    .wide-media img { height: 275px; }
    .side-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; flex: 1; min-height: 0; }
    .mn .side-layout { grid-template-columns: minmax(0, 1fr) 210px; }
    .mn .side-layout .visual { grid-column: 2; grid-row: 1; }
    .side-layout img { height: 470px; }
    .side-layout .visual { align-self: start; }
    .paired-media { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; height: 310px; flex: none; }
    .paired-media img { height: 280px; }
    .inset-layout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; flex: 1; min-height: 0; }
    .inset-stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; min-height: 0; }
    .inset-stack .visual { height: 260px; flex: none; }
    .inset-stack img { height: 235px; }
    .zh .inset-stack { order: -1; }
    .cover-media { flex: 1; min-height: 0; }
    .cover-media img { height: 100%; min-height: 0; flex: 1; }
    .cover-deck { height: 190px; flex: none; }
    .closing-media { height: 390px; flex: none; }
    .closing-media img { height: 360px; }
    .closing-reading { display: flex; gap: 28px; flex: 1; min-height: 0; min-width: 0; }
    .zh .closing-reading { flex-direction: row-reverse; }
    .closing-note { margin: 0; color: #913c43; font: 25px/1.6 "Songti SC",serif; writing-mode: vertical-rl; width: 80px; flex: none; }
    .mn .closing-note { writing-mode: vertical-lr; font-family: "Noto Sans Mongolian",sans-serif; }
    .page.cover .variant-title { font-size: 42px; writing-mode: horizontal-tb; text-orientation: mixed; }
    .page.cover .composition { grid-template-columns: minmax(0, 1fr) 100px; }
    .page.mn.cover .composition { grid-template-columns: 100px minmax(0, 1fr); }
    .cover-heading { display: block; position: relative; width: 80px; height: 834px; }
    .cover-heading .main-title { font-size: 42px; }
    .cover-heading .subtitle { font-size: 25px; color: #657068; }
    .cover-heading { writing-mode: horizontal-tb; }
    .cover-heading span { display: block; position: absolute; top: 0; left: 0; writing-mode: vertical-rl; line-height: 1.4; width: 100%; height: 560px; }
    .cover-heading .subtitle { top: 594px; height: 240px; }
    .mn .cover-heading span { writing-mode: vertical-lr; }
    .page.text-only .copy { font-size: 20px; }
    .page.mn.text-only .copy { font-size: 20px; }
    [hidden] { display: none !important; }
    @media (max-width: 800px) { header { padding: 18px; } main { padding: 18px; } .pages { grid-template-columns: 1fr; } h1 { flex-basis: 100%; } }
    @media print { body { background: white; } header, section > h2, figcaption { display: none; } main { padding: 0; } .pages { display: block; margin: 0; } .frame { width: 210mm; height: 297mm; break-after: page; } .page { transform: scale(.9997) !important; border: 0; } @page { size: A4; margin: 0; } }
  </style>
</head>
<body>
  <header><h1>Folio / Vertical Writing Study</h1><div class="tabs" aria-label="Script filter"><button data-filter="all" aria-pressed="true">All</button><button data-filter="zh" aria-pressed="false">Chinese</button><button data-filter="mn" aria-pressed="false">Mongolian</button></div><label><input id="guides" type="checkbox">Guides</label></header>
  <main>
    <section data-script="zh"><h2>Chinese / right-to-left columns</h2><div class="pages">
      <figure><div class="frame"><article class="page zh" lang="zh-Hans"><div class="runhead"><span>FOLIO / TYPE STUDY</span><span>中文竖排 · 开篇</span></div><div class="hero"><div class="visual"><img src="../../../demos/distributed-studio/assets/architecture-light.jpg" alt="Architectural facade in sunlight"><div class="caption">FIGURE 01 / IMAGE PLACEHOLDER</div></div><h3 class="title">文字之间<br>阅读的节奏</h3></div><div class="copy" data-fill="zh"></div><div class="folio"><span>CHINESE / OPENER</span><span>01</span></div></article></div><figcaption>A4 / Chinese opener</figcaption></figure>
      <figure><div class="frame"><article class="page zh" lang="zh-Hans"><div class="runhead"><span>FOLIO / TYPE STUDY</span><span>中文竖排 · 续页</span></div><h3 class="section-title">在行列之间，继续阅读</h3><div class="reading"><div class="copy" data-fill="zh"></div><aside class="rail"><img src="../../../demos/distributed-studio/assets/staircase-shadow.jpg" alt="Staircase detail"><div class="caption">FIGURE 02 / DETAIL</div><div class="note">「标点、数字与图注，都应保留清晰的阅读顺序。」</div></aside></div><div class="folio"><span>CHINESE / CONTINUATION</span><span>02</span></div></article></div><figcaption>A4 / Chinese continuation with image rail</figcaption></figure>
    </div></section>
    <section data-script="mn"><h2>Traditional Mongolian / left-to-right columns</h2><div class="pages">
      <figure><div class="frame"><article class="page mn" lang="mn-Mong"><div class="runhead"><span>FOLIO / TYPE STUDY</span><span>MONGOLIAN / OPENER</span></div><div class="hero"><h3 class="title">ᠮᠣᠩᠭᠤᠯ<br>ᠪᠢᠴᠢᠭ</h3><div class="visual"><img src="../../../demos/distributed-studio/assets/architecture-light.jpg" alt="Architectural facade in sunlight"><div class="caption">FIGURE 01 / IMAGE PLACEHOLDER</div></div></div><div class="copy" data-fill="mn"></div><div class="folio"><span>MONGOLIAN / OPENER</span><span>01</span></div></article></div><figcaption>A4 / Mongolian opener</figcaption></figure>
      <figure><div class="frame"><article class="page mn" lang="mn-Mong"><div class="runhead"><span>FOLIO / TYPE STUDY</span><span>MONGOLIAN / CONTINUATION</span></div><h3 class="section-title">ᠮᠣᠩᠭᠤᠯ ᠪᠢᠴᠢᠭ</h3><div class="reading"><div class="copy" data-fill="mn"></div><aside class="rail"><img src="../../../demos/distributed-studio/assets/staircase-shadow.jpg" alt="Staircase detail"><div class="caption">FIGURE 02 / DETAIL</div><div class="note">ᠮᠣᠩᠭᠤᠯ ᠪᠢᠴᠢᠭ</div></aside></div><div class="folio"><span>MONGOLIAN / CONTINUATION</span><span>02</span></div></article></div><figcaption>A4 / Mongolian continuation with image rail</figcaption></figure>
    </div></section>
  </main>
  <script>
    const variants = [
      ['Cover', '<div class="visual cover-media">IMAGE</div><div class="copy cover-deck" data-fill="SCRIPT"></div>'],
      ['Text only', '<div class="copy" data-fill="SCRIPT"></div>'],
      ['Wide image', '<div class="visual wide-media">IMAGE</div><div class="copy" data-fill="SCRIPT"></div>'],
      ['Side image', '<div class="side-layout"><div class="visual">IMAGE</div><div class="copy" data-fill="SCRIPT"></div></div>'],
      ['Paired images', '<div class="paired-media"><div class="visual">IMAGE</div><div class="visual">DETAIL</div></div><div class="copy" data-fill="SCRIPT"></div>'],
      ['Inset image / segmented flow', '<div class="inset-layout"><div class="copy" data-fill="SCRIPT"></div><div class="inset-stack"><div class="visual">DETAIL</div><div class="copy" data-fill="SCRIPT"></div></div></div>'],
      ['Closing', '<div class="visual closing-media">DETAIL</div><div class="closing-reading"><div class="copy" data-fill="SCRIPT"></div><p class="closing-note">ENDNOTE</p></div>']
    ];
    function media(detail) {
      return `<img src="images/${detail ? 'staircase-shadow' : 'architecture-light'}.jpg" alt="${detail ? 'Staircase detail' : 'Architectural facade'}"><div class="caption">FIGURE ${detail ? '02 / DETAIL' : '01 / ARCHITECTURE'}</div>`;
    }
    for (const script of ['zh', 'mn']) {
      const container = document.querySelector(`[data-script="${script}"] .pages`);
      container.innerHTML = variants.map(([name, layout], index) => {
        const body = layout.replaceAll('SCRIPT', script).replaceAll('IMAGE', media(false)).replaceAll('DETAIL', media(true)).replaceAll('ENDNOTE', script === 'zh' ? '在文字與圖像之間，閱讀仍在繼續。' : 'ᠮᠣᠩᠭᠤᠯ ᠪᠢᠴᠢᠭ');
        const title = name === 'Cover' ? (script === 'zh' ? '<span class="cover-heading"><span class="main-title">文字與圖像之間</span><span class="subtitle">豎排閱讀研究</span></span>' : '<span class="cover-heading"><span class="main-title">ᠮᠣᠩᠭᠤᠯ ᠪᠢᠴᠢᠭ</span></span>') : script === 'zh' ? (name === 'Closing' ? '餘頁\u3000閱讀仍在繼續' : '文字與圖像之間') : 'ᠮᠣᠩᠭᠤᠯ ᠪᠢᠴᠢᠭ';
        const role = name === 'Cover' ? 'cover' : name === 'Closing' ? 'closing' : name === 'Text only' ? 'text-only' : 'body-page';
        const reuse = role === 'cover' || role === 'closing' ? 'Sequence-specific / adapt per publication' : 'Reusable body template';
        return `<figure><div class="frame"><article class="page ${script} ${role}" lang="${script === 'zh' ? 'zh-Hans' : 'mn-Mong'}"><div class="runhead"><span>FOLIO / VERTICAL STUDY</span><span>${name.toUpperCase()}</span></div><div class="composition"><h3 class="variant-title">${title}</h3><div class="variant-body">${body}</div></div><div class="folio"><span>${script === 'zh' ? 'CHINESE' : 'MONGOLIAN'} / ${name.toUpperCase()}</span><span>0${index + 1}</span></div></article></div><figcaption>A4 / ${name} · ${reuse}</figcaption></figure>`;
      }).join('');
    }
    const samples = {
      zh: '這是一段用於觀察中文直排的占位文字。文字由上而下展開，行列依次向左延續。書頁中的標題、圖像與正文共同構成閱讀的節奏。「引號」、句號，及數字<span class="combine">12</span>，應各自保持清楚的位置。ABC 與二〇二六年也用於檢查混排。',
      mn: 'Android OS ᠳᠠᠭᠡᠷ᠎ᠡ ᠬᠢᠳᠠᠳ ᠮᠣᠩᠭᠤᠯ ᠲᠣᠯᠢ ᠭᠠᠷᠭᠠᠵᠠᠢ ᠁ Apple iOS ᠳᠡᠭᠡᠷ᠎ᠡ ᠬᠢᠳᠠᠳ ᠮᠣᠩᠭᠤᠯ ᠲᠣᠯᠢ ᠭᠠᠷᠭᠠᠵᠠᠢ ᠁'
    };
    function fill(copy) {
      copy.replaceChildren();
      if (copy.classList.contains('cover-deck')) {
        const paragraph = document.createElement('p');
        paragraph.textContent = copy.dataset.fill === 'zh'
          ? '這是一段封面導語的占位文字。用簡短篇幅呈現主題、閱讀線索與內容背景，讓標題和主圖保有清晰的層級。'
          : new DOMParser().parseFromString(samples.mn, 'text/html').body.textContent;
        copy.append(paragraph);
        return;
      }
      for (let index = 0; index < 80; index += 1) {
        const paragraph = document.createElement('p');
        paragraph.innerHTML = samples[copy.dataset.fill];
        copy.append(paragraph);
        if (copy.scrollWidth > copy.clientWidth + 1) {
          paragraph.textContent = '';
          const text = new DOMParser().parseFromString(samples[copy.dataset.fill], 'text/html').body.textContent;
          const tokens = copy.dataset.fill === 'zh' ? Array.from(text) : text.split(' ');
          for (const token of tokens) {
            const before = paragraph.textContent;
            paragraph.textContent += (copy.dataset.fill === 'mn' && before ? ' ' : '') + token;
            if (copy.scrollWidth > copy.clientWidth + 1) { paragraph.textContent = before; break; }
          }
          if (!paragraph.textContent) paragraph.remove();
          break;
        }
      }
    }
    function resize(frame) {
      const page = frame.querySelector('.page');
      page.style.transform = `scale(${frame.clientWidth / 794})`;
    }
    const observer = new ResizeObserver((entries) => entries.forEach(({ target }) => resize(target)));
    document.fonts.ready.then(() => {
      document.querySelectorAll('.copy').forEach(fill);
      document.querySelectorAll('.frame').forEach((frame) => { resize(frame); observer.observe(frame); });
      document.body.dataset.ready = 'true';
    });
    document.querySelector('#guides').addEventListener('change', (event) => document.body.classList.toggle('guides', event.target.checked));
    document.querySelectorAll('[data-filter]').forEach((button) => button.addEventListener('click', () => {
      document.querySelectorAll('[data-filter]').forEach((tab) => tab.setAttribute('aria-pressed', String(tab === button)));
      document.querySelectorAll('[data-script]').forEach((section) => { section.hidden = button.dataset.filter !== 'all' && button.dataset.filter !== section.dataset.script; });
    }));
  </script>
</body>
</html>
