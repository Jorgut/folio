@font-face{font-family:Mongolian;src:url('assets/NotoSansMongolian-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#e7ecea;color:#252928;font-family:Arial;letter-spacing:0}header{display:flex;align-items:center;gap:18px;padding:18px 24px;font-size:15px;border-bottom:1px solid #b8c1bd}header strong{margin-right:auto}a{color:inherit}main{max-width:1600px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.sheet{position:relative;aspect-ratio:4/5;min-width:0}.page{position:absolute;width:1080px;height:1350px;background:#fff;padding:64px;transform-origin:top left;display:flex;flex-direction:column;gap:30px}.meta,footer{display:flex;justify-content:space-between;font:20px/1.5 Arial;color:#64716c}footer{margin-top:auto;border-top:1px solid #cbd3cf;padding-top:16px}.composition{display:grid;grid-template-columns:100px minmax(0,1fr);gap:36px;flex:1;min-height:0}h1{margin:0;font-family:Mongolian;writing-mode:vertical-lr;font-size:56px;line-height:1.6;font-weight:400;color:#8f333d}.content{display:flex;flex-direction:column;gap:28px;min-width:0;min-height:0}.copy{font-family:Mongolian;writing-mode:vertical-lr;font-size:28px;line-height:1.8;flex:1;min-width:0;min-height:0;overflow:hidden}.copy p{margin:0;margin-block-end:22px;text-indent:0}figure{margin:0;min-height:0}img{width:100%;height:430px;object-fit:cover;display:block}.cover figure{flex:1;min-height:0}.cover img{height:100%}.cover .copy{flex:none;height:300px}.pure .copy{font-size:30px;line-height:1.9}.side .content{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px}.side img{height:100%;max-height:900px}.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}.duo img{height:380px}.closing img{height:620px}.controls{display:flex;gap:12px}.controls button{width:40px;height:40px;background:white;border:1px solid #a9b4ae;font-size:24px;cursor:pointer}.single main{display:block;max-width:1128px}[hidden]{display:none!important}@media(max-width:800px){main{grid-template-columns:1fr;padding:14px}header{flex-wrap:wrap}}@media print{header{display:none}main{display:block;padding:0;margin:0}.sheet{width:1080px;height:1350px;break-after:page}.page{transform:none!important}@page{size:1080px 1350px;margin:0}}
.slides main{display:block;max-width:none;padding:20px}.slides .sheet{aspect-ratio:16/9}.slides .page{width:1600px;height:900px;padding:52px 64px;gap:20px}.slides .content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:36px}.slides .pure .content{display:flex}.slides .copy{font-size:26px;line-height:1.7}.slides .cover .copy{height:auto;flex:1}.slides figure{min-height:0}.slides img,.slides .cover img,.slides .closing img{height:100%;max-height:660px}.slides .side .content{grid-template-columns:minmax(0,1fr) 510px}.slides .duo{grid-template-columns:1fr;grid-template-rows:1fr 1fr;min-height:0}.slides .duo img{height:100%;max-height:300px}.page{left:0;top:0}@media print{.slides main{padding:0}.slides .sheet{width:1600px;height:900px}body.slides{background:white}}
</style></head><body><header><strong>Mongolian vertical edition</strong><a href="index.html">Gallery</a><a href="?mode=single">Single page</a><a href="?mode=slides">Slides</a><a href="../index.html">Chinese edition</a><div class="controls"><button id="prev" aria-label="Previous page">←</button><button id="next" aria-label="Next page">→</button></div></header><main></main><script>
</script><style>.slides h1{font-size:44px}</style><script src="article-draft.js"></script><script>
const image=name=>`<figure><img src="assets/${name}.png" alt="Contemporary book and paper material study"></figure>`;
const copy='<div class="copy"></div>';
const pages=[['cover',image('books')+copy],['pure',copy],['',image('binding')+copy],['side',copy+image('books')],['',`<div class="duo">${image('books')}${image('binding')}</div>`+copy],['pure',copy],['',image('binding')+copy],['closing',image('books')+copy]];
document.querySelector('main').innerHTML=pages.map(([cls,body],i)=>`<div class="sheet"><article class="page ${cls}"><div class="meta"><span>${String(i+1).padStart(2,'0')}</span><span>08</span></div><div class="composition"><h1>${articleDraft[i].title}</h1><div class="content">${body}</div></div><footer><span>${String(i+1).padStart(2,'0')}</span><span>●</span></footer></article></div>`).join('');
document.querySelectorAll('.copy').forEach((e,i)=>{for(const text of articleDraft[i].paragraphs){const p=document.createElement('p');p.textContent=text;e.append(p)}});
const mode=new URLSearchParams(location.search).get('mode');const slides=mode==='slides';const single=mode==='single'||slides;document.body.classList.toggle('single',single);document.body.classList.toggle('slides',slides);document.querySelector('.controls').hidden=!single;let active=0;
function resize(){document.querySelectorAll('.sheet').forEach(e=>{if(!e.hidden)e.querySelector('.page').style.transform=`scale(${e.clientWidth/(slides?1600:1080)})`})}
function show(delta){active=(active+delta+pages.length)%pages.length;document.querySelectorAll('.sheet').forEach((e,i)=>e.hidden=single&&i!==active);resize()}
document.querySelector('#prev').onclick=()=>show(-1);document.querySelector('#next').onclick=()=>show(1);document.addEventListener('keydown',e=>{if(single&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();show(e.key==='ArrowRight'?1:-1)}});
const observer=new ResizeObserver(resize);document.querySelectorAll('.sheet').forEach(e=>observer.observe(e));
document.fonts.ready.then(()=>{show(0);document.body.dataset.ready='true'});
</script></body></html>
