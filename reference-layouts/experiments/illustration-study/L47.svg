<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title"><title id="title">L47 Central subject and paired annotations</title><defs><pattern id="hatch" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="24" height="24" fill="#d8d3c9"/><rect width="12" height="24" fill="#c8c2b7"/></pattern></defs><rect width="1280" height="720" fill="#fffdf8"/><g font-family="Arial, sans-serif" fill="#4e4941"><rect x="465" y="165" width="350" height="360" fill="none" stroke="#9f998f" stroke-width="2" stroke-dasharray="8 6"/><text x="640" y="333" font-size="23" text-anchor="middle">ISOLATED IMAGE</text><text x="640" y="367" font-size="20" text-anchor="middle">TRANSPARENT BACKGROUND</text><text x="70" y="255" font-size="27" font-weight="700">OBSERVATION</text><text x="70" y="310" font-size="22" >Describe one aspect.</text><text x="70" y="339" font-size="22" >Connect it to the subject.</text><text x="70" y="368" font-size="22" >Keep the note concise.</text><text x="905" y="255" font-size="27" font-weight="700">INTERPRETATION</text><text x="905" y="310" font-size="22" >Explain another aspect.</text><text x="905" y="339" font-size="22" >State the conditions.</text><text x="905" y="368" font-size="22" >Separate fact and opinion.</text><text x="640" y="596" font-size="22" text-anchor="middle">SUBJECT / MEDIUM / SOURCE</text><path d="M64 656H1216" stroke="#c9c2b8"/><text x="64" y="692" font-size="19" >L47 / New structure</text><text x="1216" y="692" font-size="19" text-anchor="end">FOLIO / ORIGINAL WIREFRAME</text></g></svg>