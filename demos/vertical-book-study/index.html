<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>紙、墨與文字</title><style>
@font-face{font-family:Mongolian;src:url('assets/NotoSansMongolian-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#e7ecea;color:#252928;font-family:"Songti SC",serif;letter-spacing:0}header{padding:18px 24px;display:flex;gap:18px;align-items:center;font:15px Arial;border-bottom:1px solid #b8c1bd}header a{color:inherit}header strong{margin-right:auto}main{max-width:1600px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.sheet{position:relative;aspect-ratio:4/5;min-width:0}.page{position:absolute;width:1080px;height:1350px;background:white;padding:64px;transform-origin:top left;display:flex;flex-direction:column;gap:30px}.meta,.folio,figcaption{font:20px/1.5 Arial,"PingFang SC",sans-serif;color:#64716c}.meta,.folio{display:flex;justify-content:space-between}.folio{border-top:1px solid #cbd3cf;padding-top:16px;margin-top:auto}.composition{display:grid;grid-template-columns:minmax(0,1fr) 94px;gap:36px;flex:1;min-height:0}h1{grid-column:2;grid-row:1;margin:0;writing-mode:vertical-rl;font-size:54px;line-height:1.5;font-weight:500;color:#8f333d}.content{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:28px;min-width:0;min-height:0}figure{margin:0;display:flex;flex-direction:column;gap:12px;min-height:0}img{width:100%;height:420px;object-fit:cover;display:block}.copy{writing-mode:vertical-rl;font-size:30px;line-height:1.65;flex:1;min-width:0;min-height:0;line-break:strict}.copy p{margin:0;margin-block-end:24px;text-indent:2em}.cover figure{flex:1}.cover img{height:100%;min-height:0;flex:1}.cover .copy{height:290px;flex:none}.pure .copy{font-size:34px;line-height:1.8}.side .content{display:grid;grid-template-columns:310px minmax(0,1fr);gap:30px}.side img{height:650px}.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}.duo img{height:380px}.endnote{writing-mode:vertical-rl;margin:0;height:240px;color:#8f333d;font-size:38px;line-height:1.6}.mongolian{font-family:Mongolian;writing-mode:vertical-lr;font-size:32px;line-height:1.8;height:390px;flex:none}.mongolian p{text-indent:0}.disclosure{font:22px/1.6 "PingFang SC",sans-serif;color:#63716c;margin:0}.controls{display:none}.slides main{display:block;padding:20px;max-width:none}.slides .sheet{aspect-ratio:16/9}.slides .page{width:1600px;height:900px;padding:52px 64px;gap:20px}.slides .composition{grid-template-columns:minmax(0,1fr) 110px}.slides .content{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:42px}.slides .pure .content{display:flex}.slides img{height:580px}.slides .cover .copy{height:auto;flex:1}.slides .cover img{height:100%}.slides .side .content{grid-template-columns:550px minmax(0,1fr)}.slides .duo{grid-template-columns:1fr;gap:18px}.slides .duo img{height:255px}.slides .mongolian{height:280px}.slides .endnote{height:450px}.slides .controls{display:flex;gap:12px}.controls button{font-size:24px;border:1px solid #a9b4ae;background:white;width:40px;height:40px;cursor:pointer}[hidden]{display:none!important}@media(max-width:800px){main{grid-template-columns:1fr;padding:14px}header{flex-wrap:wrap}}@media print{body{background:white}header{display:none}main{display:block;padding:0}.sheet{width:1080px;height:1350px;break-after:page}.page{transform:none!important}.slides main{padding:0}.slides .sheet{width:1600px;height:900px}@page{size:1080px 1350px;margin:0}}
.closing .content>div{display:flex;flex-direction:column;gap:24px;flex:1;min-height:0;min-width:0}
.pure .copy{font-size:32px;line-height:1.65}.slides .copy{font-size:28px;line-height:1.6}.slides .pure .copy{font-size:30px}

</style></head><body><header><strong>FOLIO / 紙、墨與文字</strong><a href="index.html">圖集</a><a href="index.html?mode=slides">演示文稿</a><a href="mongolian/index.html" lang="zh-Hant">蒙古文版</a><div class="controls"><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button></div></header><main></main><script>
const image=(src,label)=>`<figure><img src="assets/${src}.png" alt="${label}"><figcaption>${label}</figcaption></figure>`;
const copy=(paragraphs)=>`<div class="copy">${paragraphs.map(p=>`<p>${p}</p>`).join('')}</div>`;
const pages=[
['cover','紙、墨與文字',image('paper-book','紙張與裝訂')+copy(['閱讀從一張紙開始。當文字落在紙面上，方向、間距與圖像便共同構成一段可以被觀看、停留與翻閱的時間。','這是一組關於閱讀物質性的設計隨筆，也是一次現代中文直排的版面實驗。'])],
['pure','紙，讓閱讀有了重量',copy(['紙不只是文字的背景。翻頁時指尖感受到的厚薄、邊緣與阻力，也會成為閱讀經驗的一部分。螢幕上的滑動連續而輕快；紙頁則讓每一次轉換留下明確的動作。','在這組設計裡，我們不模仿泛黃的古書。頁面保持純白，讓材質的細節留在圖像中，讓正文在清楚的版心裡展開。','空白並不等於沒有內容。它可以分隔層級，容納停頓，也可以讓一段話不必與另一段話爭奪注意力。'])],
['','墨，留下清楚的邊界',image('ink-tools','墨色與印刷工具')+copy(['黑色文字與白色紙面之間的對比，讓閱讀有了穩定的落點。我們選擇克制的墨色，用少量暗紅區分標題，而不是讓每一段文字都成為強調。','正文不是裝飾。字級、列距與段首縮排，應先服務辨識與連續閱讀，再回應畫面的節奏。'])],
['side','文字向下，視線向左',image('paper-book','書頁的邊緣')+copy(['中文直排由上而下，文字列依次向左延續。本組把標題放在右側，讓讀者先辨識主題，再進入正文。這是一種構圖選擇，而非唯一的排版方式。','正文每段的第一列向下縮排兩個字位；後續列回到頂部。段首的空白提示新段落，不應被誤認為每一列都要留下相同空格。','圖像保持原有方向，圖注則與圖片緊鄰。文字方向與照片方向，各自承擔不同的閱讀任務。'])],
['','圖像，也有自己的角色',`<div class="duo">${image('paper-book','主圖：紙與書頁')}${image('ink-tools','輔圖：墨與工具')}</div>`+copy(['主圖建立場景，輔圖補充細節。當兩張圖片出現在同一頁，尺寸與位置應該說明它們的關係，而不是只把空間平均切開。','這裡的圖像是新生成的主題示意，不是歷史文物照片，也不代表特定印刷工藝的紀錄。它們用來呈現材質與圖文組合的可能。'])],
['pure','把結構留下，把內容換新',copy(['可復用的不是某一張完成的頁面，而是它背後的組織方式。純文字頁容納連續敘述，側置圖文頁讓素材與觀點並行，雙圖頁則適合建立對比與補充。','封面與收尾可以沿用骨架，卻仍要回到每次的主題，重新安排標題、主圖與文字量。復用結構，不等於讓所有內容看起來相同。','當內容改變，版面也應回應它。真正穩定的設計，是能保留秩序，又允許差異。'])],
['','翻頁，是一個小小的停頓',image('ink-tools','紙面與墨色')+copy(['一頁結束，下一頁尚未開始。翻頁的短暫停頓，讓剛讀過的文字有機會留下，也讓新的圖像不必立刻解釋一切。','頁碼、圖注與標題可以安靜地維持秩序。它們不需要搶走正文的注意力，卻應讓讀者知道自己正在何處。','當版面有了節奏，文字與圖像就不只是被放進同一個框裡，而是共同推動一段閱讀。'])],
['closing','讓閱讀，仍然可以停留',image('paper-book','閱讀的物質性')+`<div>${copy(['紙、墨與文字，並不只是三種材料。它們也提醒我們，閱讀是一種有方向、有節奏、可以停下來的經驗。','這次先把版面交給新的內容。接下來，仍需要在真實文字、不同字型與出版流程中，繼續確認它是否成立。'])}</div>`]
];
const additions = {
  1: ['同一段文字，放在不同的紙面上，會呈現不同的觀看感受。細緻的紋理讓光線變得柔和，平滑的表面則讓墨色的邊界更加清楚。材質不替內容說話，卻會影響我們接近內容的方式。', '頁面的邊緣也參與構圖。文字不必貼近裁切位置，裝訂側則需要留出翻閱的餘地。版心的範圍，既是一種秩序，也是在紙張與手之間安排閱讀的空間。', '因此，留白應該有自己的任務。有時它讓主題安靜地出現，有時它分開兩種資訊。若只是因為內容尚未完成而空著，就不應把它當成設計的答案。'],
  5: ['復用可以從最小的關係開始：標題與正文的距離、圖像與圖注的連結，以及正文與頁腳之間的邊界。這些關係穩定之後，不同頁面才有共同的語言。', '長篇敘述可以延續到下一頁，不必為了填滿畫面而縮小字體。短篇文字也不需要被拉長；可以讓圖片、引文或必要的背景資料補充內容，而不是增加無意義的重複。', '密集的閱讀頁與舒展的圖像頁交替出現，會形成不同於單頁的節奏。我們關心的不只是某一張圖是否好看，而是整組內容能否讓讀者願意繼續翻下去。'],
  6: ['一張圖片可以先建立感受，再由下一頁展開說明。連續的文字也可以在一幅細節圖前暫停，讓讀者從抽象的觀點回到具體的材料。這種接續，是頁與頁之間的對話。'],
  7: ['有些頁面需要容納更多觀點，有些頁面則只需要一張圖和一句話。它們不必擁有相同的密度，卻應讓每一次留白與每一段文字都有留下來的理由。', '當讀者合上這組頁面，我們希望留下的不是一套固定公式，而是一個可以繼續追問的問題：眼前的內容，究竟需要怎樣的閱讀空間？']
};
for (const [index, paragraphs] of Object.entries(additions)) {
  const fragment = new DOMParser().parseFromString(pages[index][2], 'text/html');
  const region = fragment.querySelector('.copy');
  const selected = Number(index) === 1 || Number(index) === 5 ? paragraphs.slice(0, 2) : paragraphs;
  for (const text of selected) { const paragraph = document.createElement('p'); paragraph.textContent = text; region.append(paragraph); }
  pages[index][2] = fragment.body.innerHTML;
}
document.querySelector('main').innerHTML=pages.map(([cls,title,body],i)=>`<div class="sheet"><article class="page ${cls}"><div class="meta"><span>FOLIO / MATERIALS OF READING</span><span>設計隨筆</span></div><div class="composition"><h1>${title}</h1><div class="content">${body}</div></div><footer class="folio"><span>紙、墨與文字</span><span>${String(i+1).padStart(2,'0')} / 08</span></footer></article></div>`).join('');
const slides=new URLSearchParams(location.search).get('mode')==='slides';document.body.classList.toggle('slides',slides);let active=0;
function show(delta){active=(active+delta+pages.length)%pages.length;document.querySelectorAll('.sheet').forEach((e,i)=>e.hidden=slides&&i!==active)}
function resize(){document.querySelectorAll('.sheet').forEach(e=>{if(!e.hidden)e.querySelector('.page').style.transform=`scale(${e.clientWidth/(slides?1600:1080)})`})}show(0);const observer=new ResizeObserver(resize);document.querySelectorAll('.sheet').forEach(e=>observer.observe(e));document.querySelector('#prev').textContent='→';document.querySelector('#next').textContent='←';document.querySelector('#prev').onclick=()=>{show(-1);resize()};document.querySelector('#next').onclick=()=>{show(1);resize()};document.addEventListener('keydown',e=>{if(slides&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();show(e.key==='ArrowLeft'?1:-1);resize()}});document.fonts.ready.then(()=>{resize();document.body.dataset.ready='true'});
</script></body></html>
